  <!-- Stylized White Rounded Typography for RMP -->
  <g fill="none" stroke="#ffffff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter R -->
    <path d="M 110 300 L 110 145 C 110 105, 145 80, 195 80 C 255 80, 290 110, 290 150 C 290 190, 255 220, 195 220 L 160 220 C 215 220, 280 250, 280 300" />
    
    <!-- Letter M -->
